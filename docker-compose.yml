version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_atividades
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: AtividadesProj
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - mongo_net

volumes:
  mongo_data:

networks:
  mongo_net:
    driver: bridge
