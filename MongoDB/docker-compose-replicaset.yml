version: "3.8"

services:
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    hostname: mongo1
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - mongo_replica_net
    restart: unless-stopped

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    hostname: mongo2
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - mongo_replica_net
    restart: unless-stopped

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    hostname: mongo3
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - mongo_replica_net
    restart: unless-stopped

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:

networks:
  mongo_replica_net:
    driver: bridge
